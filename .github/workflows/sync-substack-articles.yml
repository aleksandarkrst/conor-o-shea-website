name: Sync Substack articles

on:
  schedule:
    # Runs once a day. GitHub only fires scheduled workflows on the
    # default branch, so this needs to live there to actually run.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync articles.html from Substack RSS feed
        env:
          SUBSTACK_FEED_URL: ${{ vars.SUBSTACK_FEED_URL }}
        run: python3 scripts/sync_substack_articles.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.html articles/ sitemap.xml
          git diff --cached --quiet || git commit -m "Sync articles from Substack"
          git push
